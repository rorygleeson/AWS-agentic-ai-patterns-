<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840" role="img" aria-labelledby="title desc">
<title id="title">Network Operations API endpoint access by caller</title>
<desc id="desc">Seven callers and four endpoints. Sarah has three human endpoints across all regions; James has those endpoints only in Victoria; Emma has basic status only; David and Oliver have no Network API access; two service accounts have aggregate summary only.</desc>
<rect width="1320" height="840" rx="24" fill="#f8fafc"/>
<text x="42" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">One Network Operations API. Different endpoint permissions.</text>
<text x="42" y="91" font-family="Arial,sans-serif" font-size="19" fill="#475569">A valid sign-in does not grant access to every operation. Every request is checked.</text>
<rect x="36" y="124" width="1248" height="602" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
