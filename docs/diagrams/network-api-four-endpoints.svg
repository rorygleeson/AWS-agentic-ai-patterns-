<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 1010" width="660" height="1010" role="img" aria-labelledby="title desc"><title id="title">Four Network Operations API endpoints</title><desc id="desc">Four vertically stacked cards show endpoint method, path, purpose, and generic access rule without introducing named users.</desc><rect width="660" height="1010" rx="22" fill="#f8fafc"/><text x="28" y="46" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">One API · Four endpoints</text><text x="28" y="78" font-family="Arial,sans-serif" font-size="18" fill="#475569">Different operations. Different permissions.</text><rect x="23" y="103" width="614" height="201" rx="19" fill="#fff" stroke="#cbd5e1"/><rect x="23" y="103" width="9" height="201" rx="4" fill="#0f766e"/><circle cx="69" cy="141" r="21" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="69" y="148" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f766e">01</text><text x="104" y="148" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Asset status</text><rect x="492" y="122" width="111" height="36" rx="10" fill="#f0fdfa"/><text x="547" y="147" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0f766e">GET</text><text x="48" y="187" font-family="monospace" font-size="20" fill="#1e293b">/assets/{id}/status</text><text x="48" y="218" font-family="Arial,sans-serif" font-size="18" fill="#475569">Read basic network asset status</text><line x1="48" y1="235" x2="607" y2="235" stroke="#e2e8f0"/><text x="48" y="260" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0f766e">ACCESS</text><text x="135" y="260" font-family="Arial,sans-serif" font-size="18" fill="#334155">Authorised users</text><text x="135" y="284" font-family="Arial,sans-serif" font-size="17" fill="#334155">Some see basic fields only</text><rect x="23" y="319" width="614" height="201" rx="19" fill="#fff" stroke="#cbd5e1"/><rect x="23" y="319" width="9" height="201" rx="4" fill="#2563eb"/><circle cx="69" cy="357" r="21" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="69" y="364" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2563eb">02</text><text x="104" y="364" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Diagnostics</text><rect x="492" y="338" width="111" height="36" rx="10" fill="#eff6ff"/><text x="547" y="363" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#2563eb">GET</text><text x="48" y="403" font-family="monospace" font-size="20" fill="#1e293b">/assets/{id}/diagnostics</text><text x="48" y="434" font-family="Arial,sans-serif" font-size="18" fill="#475569">Read detailed fault information</text><line x1="48" y1="451" x2="607" y2="451" stroke="#e2e8f0"/><text x="48" y="476" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2563eb">ACCESS</text><text x="135" y="476" font-family="Arial,sans-serif" font-size="18" fill="#334155">Authorised engineers and admins</text><text x="135" y="500" font-family="Arial,sans-serif" font-size="17" fill="#334155">Permitted regions only</text><rect x="23" y="535" width="614" height="201" rx="19" fill="#fff" stroke="#cbd5e1"/><rect x="23" y="535" width="9" height="201" rx="4" fill="#b45309"/><circle cx="69" cy="573" r="21" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="69" y="580" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#b45309">03</text><text x="104" y="580" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Support tickets</text><rect x="492" y="554" width="111" height="36" rx="10" fill="#fffbeb"/><text x="547" y="579" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#b45309">POST</text><text x="48" y="619" font-family="monospace" font-size="20" fill="#1e293b">/tickets</text><text x="48" y="650" font-family="Arial,sans-serif" font-size="18" fill="#475569">Create a network support ticket</text><line x1="48" y1="667" x2="607" y2="667" stroke="#e2e8f0"/><text x="48" y="692" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#b45309">ACCESS</text><text x="135" y="692" font-family="Arial,sans-serif" font-size="18" fill="#334155">Authorised engineers and admins</text><text x="135" y="716" font-family="Arial,sans-serif" font-size="17" fill="#334155">Region restriction + user confirmation</text><rect x="23" y="751" width="614" height="201" rx="19" fill="#fff" stroke="#cbd5e1"/><rect x="23" y="751" width="9" height="201" rx="4" fill="#7c3aed"/><circle cx="69" cy="789" r="21" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="69" y="796" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#7c3aed">04</text><text x="104" y="796" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Health summary</text><rect x="492" y="770" width="111" height="36" rx="10" fill="#f5f3ff"/><text x="547" y="795" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#7c3aed">GET</text><text x="48" y="835" font-family="monospace" font-size="20" fill="#1e293b">/network/health-summary</text><text x="48" y="866" font-family="Arial,sans-serif" font-size="18" fill="#475569">Read aggregate network health</text><line x1="48" y1="883" x2="607" y2="883" stroke="#e2e8f0"/><text x="48" y="908" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#7c3aed">ACCESS</text><text x="135" y="908" font-family="Arial,sans-serif" font-size="18" fill="#334155">Approved service accounts (M2M) only</text><text x="135" y="932" font-family="Arial,sans-serif" font-size="17" fill="#334155">No individual asset details</text><text x="29" y="994" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Specific callers and permitted endpoints are shown in the next section.</text></svg>