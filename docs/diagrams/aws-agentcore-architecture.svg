<text x="40" y="833" class="note">Only get_network_health_summary is exposed on G2. Its caller is Runtime M's role, not the Reporter Lambda role.</text>
<rect x="20" y="890" width="1380" height="198" rx="16" fill="#fff" stroke="#d8e0eb"/>
<text x="42" y="922" class="section">Identity and authorization callouts</text>
<text x="43" y="952" class="note">① Entra login / JWT  ② preserve original JWT; Lambda IAM only invokes  ③ Runtime validates JWT  ④ Cedar tool check</text>
<text x="43" y="979" class="note">⑤ Shared RAG via IAM  ⑥ OpenAPI REST targets exchange Entra user token OBO; downstream API checks user + RLS</text>
<text x="43" y="1006" class="note">⑦ Independent vendor consent / 3LO  ⑧ Native REST stage uses Gateway IAM (not Oliver identity)  ⑨ RLS behind API</text>
<text x="43" y="1033" class="note">⑩ IAM machine gateway authorizes Runtime M role  ⑪ OAuth client credentials 2LO; API authorizes app-only aggregate scope</text>
<text x="43" y="1064" class="note">Illustrative logical architecture; token handling, policies and network routes are specified in the linked design docs.</text>
</svg>