<svg xmlns="http://www.w3.org/2000/svg" width="780" height="2310" viewBox="0 0 780 2310" role="img" aria-labelledby="t d"><title id="t">AgentCore PoC top-down architecture</title><desc id="d">Two service accounts and five human users at the top, with the humans connected to the Enterprise AI Application, AgentCore Runtime, two gateways with distinct authentication, and four downstream systems.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs><rect width="780" height="2310" fill="#f8fafc"/><text x="35" y="55" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#0f172a">AWS AgentCore architecture</text><text x="35" y="92" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#475569">Five people · Two service accounts · Four systems</text><text x="35" y="139" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#172033">Callers</text><g transform="translate(0 -143)"><rect x="40" y="301" width="700" height="122" rx="17" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><text x="62" y="335" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#172033">Automated callers (M2M)</text><circle cx="80" cy="368" r="14" fill="#0f766e"/><rect x="73" y="361" width="14" height="14" rx="3" fill="none" stroke="white" stroke-width="2"/><text x="107" y="374" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#172033">AWS Service Account (using IAM Role)</text><circle cx="80" cy="403" r="14" fill="#be185d"/><rect x="73" y="396" width="14" height="14" rx="3" fill="none" stroke="white" stroke-width="2"/><text x="107" y="409" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#172033">Entra Service Account</text></g><g transform="translate(0 163)"><rect x="40" y="158" width="700" height="127" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="62" y="191" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#172033">Human users (Entra sign-in)</text><circle cx="108" cy="228" r="15" fill="#2563eb"/><circle cx="108" cy="223" r="4" stroke="white" fill="none" stroke-width="2"/><path d="M100 237q0-9 8-9t8 9" fill="none" stroke="white" stroke-width="2"/><text x="80" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#172033">Sarah</text><circle cx="241" cy="228" r="15" fill="#8b5cf6"/><circle cx="241" cy="223" r="4" stroke="white" fill="none" stroke-width="2"/><path d="M233 237q0-9 8-9t8 9" fill="none" stroke="white" stroke-width="2"/><text x="213" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#172033">James</text><circle cx="374" cy="228" r="15" fill="#ea580c"/><circle cx="374" cy="223" r="4" stroke="white" fill="none" stroke-width="2"/><path d="M366 237q0-9 8-9t8 9" fill="none" stroke="white" stroke-width="2"/><text x="346" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#172033">Emma</text><circle cx="507" cy="228" r="15" fill="#0891b2"/><circle cx="507" cy="223" r="4" stroke="white" fill="none" stroke-width="2"/><path d="M499 237q0-9 8-9t8 9" fill="none" stroke="white" stroke-width="2"/><text x="479" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#172033">David</text><circle cx="640" cy="228" r="15" fill="#64748b"/><circle cx="640" cy="223" r="4" stroke="white" fill="none" stroke-width="2"/><path d="M632 237q0-9 8-9t8 9" fill="none" stroke="white" stroke-width="2"/><text x="612" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#172033">Oliver</text></g><path d="M390 448V515" stroke="#3b82f6" stroke-width="3" fill="none"/><g transform="translate(0 50)"><rect x="110" y="465" width="560" height="87" rx="17" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="149" y="500" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#172033">Enterprise AI Application</text><text x="149" y="531" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#475569">Signed-in humans submit requests</text><path d="M390 553V633" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/></g><g transform="translate(0 90)"><rect x="110" y="593" width="560" height="115" rx="17" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/><text x="144" y="634" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#172033">Amazon Bedrock AgentCore Runtime</text><text x="144" y="674" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#475569">AI agent discovers and invokes tools</text><path d="M390 709V855" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/></g><g transform="translate(0 150)"><text x="35" y="781" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033">AgentCore Gateways</text><text x="35" y="811" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#475569">Tool access is checked before integration calls</text></g><g transform="translate(0 190)"><rect x="40" y="834" width="335" height="186" rx="17" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="63" y="875" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#075985">G1 — OAuth/JWT</text><text x="63" y="912" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Entra-issued access token</text><text x="63" y="947" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Human users + Entra</text><text x="63" y="976" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Service Account</text><rect x="405" y="834" width="335" height="186" rx="17" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="427" y="875" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#6d28d9">G2 — IAM/SigV4</text><text x="427" y="912" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">AWS-signed requests</text><text x="427" y="953" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">AWS Service Account only</text><text x="427" y="982" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569">(using IAM Role)</text><path d="M390 755V826H207V834" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="40" y="1054" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#334155">One inbound auth type per gateway: G1 = JWT; G2 = IAM.</text><text x="40" y="1086" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#475569">Each downstream API still enforces its own permissions.</text><path d="M390 1102V1148" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="35" y="1180" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#172033">Downstream systems</text><rect x="40" y="1200" width="700" height="175" rx="17" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><rect x="40" y="1200" width="11" height="175" rx="5" fill="#10b981"/><text x="69" y="1245" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033">1. Shared knowledge (RAG)</text><text x="69" y="1288" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Amazon Bedrock Knowledge Bases</text><text x="69" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Shared approved documents · AWS IAM service role</text><rect x="40" y="1391" width="700" height="250" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><rect x="40" y="1391" width="11" height="250" rx="5" fill="#0284c7"/><text x="69" y="1436" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033">2. Network Operations API</text><text x="69" y="1479" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Four REST endpoints · one shared backend</text><text x="69" y="1515" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">API Gateway → Lambda → RDS PostgreSQL</text><text x="69" y="1551" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">OAuth 2.0: OBO (human) or Client Credentials (M2M)</text><text x="69" y="1587" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Endpoint/region checks; PostgreSQL row-level security</text><rect x="40" y="1657" width="700" height="178" rx="17" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><rect x="40" y="1657" width="11" height="178" rx="5" fill="#e11d48"/><text x="69" y="1702" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033">3. External NetworkMonitor (3PP)</text><text x="69" y="1745" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Separate vendor's monitoring service</text><text x="69" y="1781" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Requires its own vendor OAuth authorization</text><rect x="40" y="1851" width="700" height="185" rx="17" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="40" y="1851" width="11" height="185" rx="5" fill="#7c3aed"/><text x="69" y="1896" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033">4. Platform Health API</text><text x="69" y="1939" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">Internal AWS-protected REST API</text><text x="69" y="1975" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033">API Gateway · IAM/SigV4 · read-only health data</text><text x="42" y="2080" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#475569">Gateway access and downstream API access are checked separately.</text></g><defs><marker id="iamarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="entraarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be185d"/></marker></defs><path d="M480 225H758V1175H739" fill="none" stroke="#0f766e" stroke-width="4" stroke-linejoin="round"/><path d="M64 259H24V1175H41" fill="none" stroke="#be185d" stroke-width="4" stroke-linejoin="round"/></svg>