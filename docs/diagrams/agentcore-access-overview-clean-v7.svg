<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1050" viewBox="0 0 800 1050" role="img" aria-labelledby="title desc"><title id="title">High-level AgentCore architecture</title><desc id="desc">Five distinct coloured human icons and two distinct coloured service-account icons access AgentCore through interactive and automated routes. AgentCore connects to four downstream systems. User names and permissions are introduced in the next section.</desc>
