<svg xmlns="http://www.w3.org/2000/svg" width="700" height="590" viewBox="0 0 700 590" role="img" aria-labelledby="title desc">
<title id="title">High-level AgentCore architecture and four downstream systems</title>
<desc id="desc">Five human users access the Enterprise AI Application; two service accounts use automated routes. AgentCore Runtime and Gateways connect to four downstream systems: Shared Knowledge, Network Operations API, NetworkMonitor and Platform Health API. Caller permissions are detailed separately.</desc>
