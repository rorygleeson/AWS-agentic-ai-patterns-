<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1250" viewBox="0 0 850 1250" role="img" aria-labelledby="title desc"><title id="title">High-level AgentCore access routes</title><desc id="desc">Five human users enter the Enterprise AI Application then the agent in Runtime and G1. Entra Service Account invokes Runtime and the agent through G1. AWS Service Account directly invokes G2 without an agent. Gateways connect to four downstream systems. User permissions are detailed in Section 2.</desc><rect width="850" height="1250" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif">
