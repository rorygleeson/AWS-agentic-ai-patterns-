<svg xmlns="http://www.w3.org/2000/svg" width="700" height="2200" viewBox="0 0 700 2200" role="img" aria-labelledby="title desc"><title id="title">AWS AgentCore detailed architecture, mobile reading layout</title><desc id="desc">Three separate invocation routes: humans use the Enterprise AI Application and Runtime to G1; AWS scheduled Lambda invokes G2 directly; Entra automation uses Runtime and G1 with separate token audiences. Four downstream systems have consistent colors.</desc><rect x="0" y="0" width="700" height="2200" rx="0" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="350" y="44" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">AWS AgentCore architecture</text><text x="350" y="76" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Three invocation paths · Four downstream systems</text><rect x="18" y="100" width="664" height="885" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="143" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">1. Human → AI agent → G1</text><text x="40" y="171" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Five people sign in to the Enterprise AI Application</text><circle cx="78" cy="213" r="17" fill="#2563eb"/><circle cx="78" cy="208" r="5" fill="none" stroke="white" stroke-width="2"/><path d="M68 223 Q68 212 78 212 Q88 212 88 223" fill="none" stroke="white" stroke-width="2"/><text x="78" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Sarah</text><circle cx="213" cy="213" r="17" fill="#8b5cf6"/><circle cx="213" cy="208" r="5" fill="none" stroke="white" stroke-width="2"/><path d="M203 223 Q203 212 213 212 Q223 212 223 223" fill="none" stroke="white" stroke-width="2"/><text x="213" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">James</text><circle cx="348" cy="213" r="17" fill="#ea580c"/><circle cx="348" cy="208" r="5" fill="none" stroke="white" stroke-width="2"/><path d="M338 223 Q338 212 348 212 Q358 212 358 223" fill="none" stroke="white" stroke-width="2"/><text x="348" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Emma</text><circle cx="483" cy="213" r="17" fill="#0891b2"/><circle cx="483" cy="208" r="5" fill="none" stroke="white" stroke-width="2"/><path d="M473 223 Q473 212 483 212 Q493 212 493 223" fill="none" stroke="white" stroke-width="2"/><text x="483" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">David</text><circle cx="618" cy="213" r="17" fill="#64748b"/><circle cx="618" cy="208" r="5" fill="none" stroke="white" stroke-width="2"/><path d="M608 223 Q608 212 618 212 Q628 212 628 223" fill="none" stroke="white" stroke-width="2"/><text x="618" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Oliver</text><path d="M350 260 L350 279" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="279" width="616" height="78" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="66" y="310" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Enterprise AI Application</text><text x="66" y="339" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Entra sign-in: OAuth Authorization Code + PKCE</text><path d="M350 357 L350 378" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="378" width="616" height="78" rx="14" fill="#eaf4ff" stroke="#38bdf8" stroke-width="2"/><text x="66" y="409" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Amazon API Gateway → Chat API Lambda</text><text x="66" y="438" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Validate human JWT; forward trusted identity</text><path d="M350 456 L350 477" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="477" width="616" height="78" rx="14" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/><text x="66" y="508" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Amazon Bedrock AgentCore Runtime</text><text x="66" y="537" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">AI agent reasons about the user's request</text><path d="M350 555 L350 576" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="576" width="616" height="78" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="66" y="607" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">AgentCore Gateway G1 — JWT</text><text x="66" y="636" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Cedar checks the user and chosen MCP tool</text><path d="M350 654 L350 679" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><text x="350" y="706" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#334155" text-anchor="middle">Approved tools can reach four systems</text><rect x="42" y="724" width="302" height="89" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="57" y="758" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Shared Knowledge (RAG)</text><text x="57" y="789" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">AWS IAM retrieval</text><rect x="356" y="724" width="302" height="89" rx="14" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/><text x="371" y="758" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Network Operations API</text><text x="371" y="789" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Entra OAuth OBO</text><rect x="42" y="827" width="302" height="89" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="57" y="861" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">NetworkMonitor (3PP)</text><text x="57" y="892" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Vendor Authorization Code</text><rect x="356" y="827" width="302" height="89" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="371" y="861" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Platform Health API</text><text x="371" y="892" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">AWS IAM / SigV4</text><text x="350" y="958" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Each system still checks its own permissions.</text><rect x="18" y="1009" width="664" height="520" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="1052" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">2. AWS Service Account → G2 directly</text><text x="40" y="1081" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Scheduled Lambda invokes a known tool; no AI Runtime.</text><rect x="42" y="1105" width="616" height="78" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="66" y="1136" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">AWS Service Account (using IAM Role)</text><text x="66" y="1165" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">EventBridge Scheduler starts Reporter Lambda</text><path d="M350 1183 L350 1202" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="1202" width="616" height="78" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="66" y="1233" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Reporter Lambda</text><text x="66" y="1262" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Signs MCP tool request using its IAM role</text><path d="M350 1280 L350 1299" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="1299" width="616" height="78" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="66" y="1330" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">AgentCore Gateway G2 — IAM/SigV4</text><text x="66" y="1359" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Verifies approved Lambda execution role</text><path d="M350 1377 L350 1396" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="1396" width="616" height="78" rx="14" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/><text x="66" y="1427" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Network Operations API — endpoint 04</text><text x="66" y="1456" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Gateway obtains Entra OAuth Client Credentials</text><text x="350" y="1508" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Health summary only · No human identity</text><rect x="18" y="1552" width="664" height="528" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="1595" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">3. Entra Service Account → AI agent</text><text x="40" y="1624" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Automated analysis prompt; separate token audiences.</text><rect x="42" y="1648" width="616" height="78" rx="14" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/><text x="66" y="1679" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Entra Service Account</text><text x="66" y="1708" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Client Credentials JWT for Runtime audience</text><path d="M350 1726 L350 1742" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="1742" width="616" height="78" rx="14" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/><text x="66" y="1773" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Amazon Bedrock AgentCore Runtime</text><text x="66" y="1802" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">AI analysis prompt; obtains G1-audience JWT</text><path d="M350 1820 L350 1836" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="1836" width="616" height="78" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="66" y="1867" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">AgentCore Gateway G1 — JWT</text><text x="66" y="1896" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Cedar authorizes summary tool only</text><path d="M350 1914 L350 1930" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="1930" width="616" height="78" rx="14" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/><text x="66" y="1961" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Network Operations API — endpoint 04</text><text x="66" y="1990" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Separate API-audience OAuth Client Credentials</text><text x="350" y="2062" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Health summary only · No borrowed human token</text><text x="350" y="2116" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#334155" text-anchor="middle">Gateway inbound auth and downstream API auth</text><text x="350" y="2144" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">are separate checks. Lines show invocation, not token reuse.</text></svg>