<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1970" viewBox="0 0 760 1970" role="img" aria-labelledby="title desc"><title id="title">James's AgentCore token journey with visual tokens</title><desc id="desc">At initial sign-in Entra issues an ID token and Runtime access token together. The Enterprise AI Application uses the Runtime token. OBO exchange one replaces it with a G1 access token for AgentCore Gateway. OBO exchange two replaces the G1 token with a Network API access token for the Network Operations API, preserving James's identity.</desc><rect width="760" height="1970" rx="22" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><path d="M380 184V208" stroke="#64748b" stroke-width="3" fill="none"/><path d="M372 197L380 210L388 197" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 341V426" stroke="#64748b" stroke-width="3" fill="none"/><path d="M372 415L380 428L388 415" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 524V635" stroke="#64748b" stroke-width="3" fill="none"/><path d="M372 624L380 637L388 624" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 733V770" stroke="#64748b" stroke-width="3" fill="none"/><path d="M372 759L380 772L388 759" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 987V1080" stroke="#64748b" stroke-width="3" fill="none"/><path d="M372 1069L380 1082L388 1069" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 1178V1283" stroke="#64748b" stroke-width="3" fill="none"/><path d="M372 1272L380 1285L388 1272" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 1431V1528" stroke="#64748b" stroke-width="3" fill="none"/><path d="M372 1517L380 1530L388 1517" stroke="#64748b" stroke-width="3" fill="none"/><path d="M380 1627V1723" stroke="#64748b" stroke-width="3" fill="none"/><path d="M372 1712L380 1725L388 1712" stroke="#64748b" stroke-width="3" fill="none"/><text x="380" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#17233a">James's token journey</text><text x="380" y="73" text-anchor="middle" font-size="18" fill="#64748b">“What's wrong with router R123 in Melbourne?”</text><rect x="100" y="95" width="560" height="89" rx="18" fill="#e8f2ff" stroke="#4d83d8" stroke-width="2.5"/><text x="380" y="132" text-anchor="middle" font-size="24" font-weight="700" fill="#163b78">Microsoft Entra ID</text><text x="380" y="163" text-anchor="middle" font-size="18" fill="#334155">James authenticates (OIDC / PKCE)</text><rect x="77" y="220" width="606" height="121" rx="28" fill="#fff2d9" stroke="#d78a20" stroke-width="3"/><text x="380" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#91500d">Initial sign-in — both tokens issued together</text><rect x="98" y="270" width="270" height="46" rx="20" fill="#fff" stroke="#64748b" stroke-width="2"/><path d="M115 278l10 5v17l-10 5l-10 -5v-17z" fill="#64748b"/><circle cx="115" cy="290" r="3" fill="#fff"/><text x="132" y="299" font-size="17" font-weight="700" fill="#243247">ID token · Login</text><rect x="392" y="270" width="270" height="46" rx="20" fill="#fff" stroke="#0f766e" stroke-width="2"/><path d="M409 278l10 5v17l-10 5l-10 -5v-17z" fill="#0f766e"/><circle cx="409" cy="290" r="3" fill="#fff"/><text x="426" y="299" font-size="17" font-weight="700" fill="#243247">Runtime access token</text><text x="233" y="332" text-anchor="middle" font-size="14" fill="#475569">Establishes application session</text><text x="527" y="332" text-anchor="middle" font-size="14" fill="#475569">Audience: AgentCore Runtime</text><g transform="translate(0 60)"><rect x="100" y="376" width="560" height="88" rx="18" fill="#e8f2ff" stroke="#4d83d8" stroke-width="2.5"/></g><g transform="translate(0 60)"><text x="380" y="413" text-anchor="middle" font-size="24" font-weight="700" fill="#163b78">Enterprise AI Application</text></g><g transform="translate(0 60)"><text x="380" y="444" text-anchor="middle" font-size="18" fill="#334155">James is signed in and asks his question</text></g><g transform="translate(0 90)"><rect x="418" y="470" width="242" height="38" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2"/></g><g transform="translate(0 90)"><path d="M435 478l10 5v13l-10 5l-10 -5v-13z" fill="#0f766e"/></g><g transform="translate(0 90)"><circle cx="435" cy="490" r="3" fill="#fff"/></g><g transform="translate(0 90)"><text x="452" y="495" font-size="16" font-weight="700" fill="#243247">Runtime access token</text></g><g transform="translate(0 140)"><rect x="100" y="505" width="560" height="88" rx="18" fill="#e4f6f1" stroke="#1a9a7c" stroke-width="2.5"/></g><g transform="translate(0 140)"><text x="380" y="542" text-anchor="middle" font-size="24" font-weight="700" fill="#125748">AgentCore Runtime</text></g><g transform="translate(0 140)"><text x="380" y="573" text-anchor="middle" font-size="18" fill="#334155">AI agent selects the diagnostics tool</text></g><g transform="translate(0 210)"><ellipse cx="380" cy="708" rx="330" ry="69" fill="#fff2d9" stroke="#d78a20" stroke-width="3"/></g><g transform="translate(0 210)"><text x="380" y="670" text-anchor="middle" font-size="23" font-weight="700" fill="#92500b">OBO #1 — token exchange (James)</text></g><g transform="translate(0 210)"><rect x="104" y="691" width="249" height="38" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2"/></g><g transform="translate(0 210)"><path d="M121 699l10 5v13l-10 5l-10 -5v-13z" fill="#0f766e"/></g><g transform="translate(0 210)"><circle cx="121" cy="711" r="3" fill="#fff"/></g><g transform="translate(0 210)"><text x="138" y="716" font-size="16" font-weight="700" fill="#243247">Runtime access token</text></g><g transform="translate(0 210)"><text x="380" y="718" text-anchor="middle" font-size="26" font-weight="700" fill="#92500b">→</text></g><g transform="translate(0 210)"><rect x="407" y="691" width="249" height="38" rx="16" fill="#fff" stroke="#6d57bd" stroke-width="2"/></g><g transform="translate(0 210)"><path d="M424 699l10 5v13l-10 5l-10 -5v-13z" fill="#6d57bd"/></g><g transform="translate(0 210)"><circle cx="424" cy="711" r="3" fill="#fff"/></g><g transform="translate(0 210)"><text x="441" y="716" font-size="16" font-weight="700" fill="#243247">G1 access token</text></g><g transform="translate(0 280)"><rect x="100" y="810" width="560" height="88" rx="18" fill="#e9edff" stroke="#7074cf" stroke-width="2.5"/></g><g transform="translate(0 280)"><text x="380" y="847" text-anchor="middle" font-size="24" font-weight="700" fill="#3c408d">AgentCore Gateway (G1)</text></g><g transform="translate(0 280)"><text x="380" y="878" text-anchor="middle" font-size="18" fill="#334155">Validates G1 token; Cedar authorizes tool</text></g><g transform="translate(0 350)"><ellipse cx="380" cy="1012" rx="330" ry="69" fill="#fff2d9" stroke="#d78a20" stroke-width="3"/></g><g transform="translate(0 350)"><text x="380" y="975" text-anchor="middle" font-size="23" font-weight="700" fill="#92500b">OBO #2 — token exchange (James)</text></g><g transform="translate(0 350)"><rect x="104" y="995" width="249" height="38" rx="16" fill="#fff" stroke="#6d57bd" stroke-width="2"/></g><g transform="translate(0 350)"><path d="M121 1003l10 5v13l-10 5l-10 -5v-13z" fill="#6d57bd"/></g><g transform="translate(0 350)"><circle cx="121" cy="1015" r="3" fill="#fff"/></g><g transform="translate(0 350)"><text x="138" y="1020" font-size="16" font-weight="700" fill="#243247">G1 access token</text></g><g transform="translate(0 350)"><text x="380" y="1022" text-anchor="middle" font-size="26" font-weight="700" fill="#92500b">→</text></g><g transform="translate(0 350)"><rect x="407" y="995" width="249" height="38" rx="16" fill="#fff" stroke="#0284c7" stroke-width="2"/></g><g transform="translate(0 350)"><path d="M424 1003l10 5v13l-10 5l-10 -5v-13z" fill="#0284c7"/></g><g transform="translate(0 350)"><circle cx="424" cy="1015" r="3" fill="#fff"/></g><g transform="translate(0 350)"><text x="441" y="1020" font-size="16" font-weight="700" fill="#243247">Network API access token</text></g><g transform="translate(0 420)"><rect x="100" y="1118" width="560" height="89" rx="18" fill="#e6f5ff" stroke="#2785ba" stroke-width="2.5"/></g><g transform="translate(0 420)"><text x="380" y="1155" text-anchor="middle" font-size="24" font-weight="700" fill="#14577d">Network Operations API</text></g><g transform="translate(0 420)"><text x="380" y="1186" text-anchor="middle" font-size="18" fill="#334155">Validates token; enforces James's VIC-only access</text></g><g transform="translate(0 490)"><rect x="100" y="1243" width="560" height="63" rx="16" fill="#dcfce7" stroke="#2d9b56" stroke-width="2.5"/></g><g transform="translate(0 490)"><text x="380" y="1282" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">Permitted result → AI agent → James</text></g><g transform="translate(0 530)"><text x="380" y="1350" text-anchor="middle" font-size="17" fill="#475569">Each access token has a different audience.</text></g><g transform="translate(0 530)"><text x="380" y="1376" text-anchor="middle" font-size="17" fill="#475569">OBO preserves James's identity; it does not grant extra permissions.</text></g></g></svg>