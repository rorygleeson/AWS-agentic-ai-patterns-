<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1225" viewBox="0 0 760 1225" role="img" aria-labelledby="title desc">
<title id="title">James's end-to-end AgentCore diagnostics flow</title>
<desc id="desc">Entra ID issues an ID token to establish the application sign-in, and a separate Runtime-audience access token is used to invoke AgentCore Runtime, exchanges his token via OBO for Gateway G1, passes Cedar tool authorization, uses another OBO token for Network Operations API, and receives a response.</desc>
<rect width="760" height="1225" rx="24" fill="#f8fafc"/>
<text x="380" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17233a">James asks about router R123</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="155" y="73" width="450" height="73" rx="18" fill="#eff6ff" stroke="#477fc7" stroke-width="2"/>
<text x="380" y="105" font-size="23" font-weight="700" fill="#184a83">Microsoft Entra ID</text>
<text x="380" y="132" font-size="17" fill="#334155">James authenticates (OIDC)</text>
<path d="M380 146 V161" stroke="#64748b" stroke-width="3"/><path d="M372 153 L380 164 L388 153" fill="none" stroke="#64748b" stroke-width="3"/>
<ellipse cx="380" cy="199" rx="286" ry="34" fill="#fff2d9" stroke="#d78a20" stroke-width="2.5"/>
<text x="380" y="194" font-size="20" font-weight="700" fill="#92500b">Login: ID token</text>
<text x="380" y="218" font-size="16" fill="#674313">App establishes James's session</text>
<path d="M380 233 V251" stroke="#64748b" stroke-width="3"/><path d="M372 240 L380 253 L388 240" fill="none" stroke="#64748b" stroke-width="3"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle" transform="translate(0 175)">
<rect x="105" y="78" width="550" height="100" rx="18" fill="#e8f1ff" stroke="#4d83d8" stroke-width="2"/>
<text x="380" y="117" font-size="24" font-weight="700" fill="#163b78">Enterprise AI Application</text>
<text x="380" y="151" font-size="19" fill="#334155">James is signed in; asks question</text>
<path d="M380 178 V222" stroke="#64748b" stroke-width="3" fill="none"/><path d="M371 211 L380 226 L389 211" fill="none" stroke="#64748b" stroke-width="3"/>
<text x="462" y="200" font-size="16" fill="#475569">Entra-issued Runtime</text><text x="462" y="220" font-size="16" fill="#475569">access token</text>
<rect x="105" y="230" width="550" height="100" rx="18" fill="#e4f6f1" stroke="#1a9a7c" stroke-width="2"/>
<text x="380" y="269" font-size="24" font-weight="700" fill="#125748">AgentCore Runtime</text>
<text x="380" y="303" font-size="19" fill="#334155">AI agent selects diagnostics tool</text>
<path d="M380 330 V377" stroke="#64748b" stroke-width="3" fill="none"/><path d="M371 365 L380 380 L389 365" fill="none" stroke="#64748b" stroke-width="3"/>
<ellipse cx="380" cy="431" rx="310" ry="45" fill="#fff2d9" stroke="#d78a20" stroke-width="3"/>
<text x="380" y="420" font-size="23" font-weight="700" fill="#92500b">OBO #1 — Token exchange</text>
<text x="380" y="451" font-size="18" fill="#674313">Runtime token → G1 token (James)</text>
<path d="M380 476 V521" stroke="#64748b" stroke-width="3" fill="none"/><path d="M371 509 L380 524 L389 509" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="105" y="529" width="550" height="110" rx="18" fill="#e9edff" stroke="#7074cf" stroke-width="2"/>
<text x="380" y="568" font-size="24" font-weight="700" fill="#3c408d">AgentCore Gateway (G1)</text>
<text x="380" y="599" font-size="19" fill="#334155">Validates token; Cedar permits tool</text>
<path d="M380 639 V684" stroke="#64748b" stroke-width="3" fill="none"/><path d="M371 672 L380 687 L389 672" fill="none" stroke="#64748b" stroke-width="3"/>
<ellipse cx="380" cy="738" rx="310" ry="45" fill="#fff2d9" stroke="#d78a20" stroke-width="3"/>
<text x="380" y="728" font-size="23" font-weight="700" fill="#92500b">OBO #2 — Token exchange</text>
<text x="380" y="758" font-size="18" fill="#674313">G1 token → API token (James)</text>
<path d="M380 783 V828" stroke="#64748b" stroke-width="3" fill="none"/><path d="M371 816 L380 831 L389 816" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="105" y="837" width="550" height="109" rx="18" fill="#e6f5ff" stroke="#2785ba" stroke-width="2"/>
<text x="380" y="877" font-size="24" font-weight="700" fill="#14577d">Network Operations API</text>
<text x="380" y="908" font-size="19" fill="#334155">Validates token; enforces VIC-only access</text>
<rect x="105" y="970" width="550" height="57" rx="15" fill="#dcfce7" stroke="#2d9b56" stroke-width="2"/>
<text x="380" y="1006" font-size="20" font-weight="700" fill="#166534">Permitted result → agent → James</text>
<path d="M380 946 V966" stroke="#2d9b56" stroke-width="3"/><path d="M372 956 L380 968 L388 956" fill="none" stroke="#2d9b56" stroke-width="3"/>
</g></svg>