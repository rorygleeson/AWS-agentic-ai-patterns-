<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1450" viewBox="0 0 760 1450" role="img" aria-labelledby="title desc"><title id="title">James's AgentCore token journey</title><desc id="desc">James signs in through Entra ID and receives an ID token and Runtime access token. The Enterprise AI Application calls AgentCore Runtime, followed by two OAuth on-behalf-of exchanges to AgentCore Gateway and the Network Operations API. Every stage is connected by a consistently spaced arrow.</desc><rect width="760" height="1450" rx="22" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="380" y="48" font-size="28" font-weight="700" fill="#17233a" text-anchor="middle">James's token journey</text><text x="380" y="77" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">“What's wrong with router R123 in Melbourne?”</text><rect x="100" y="105" width="560" height="90" rx="18" fill="#e8f2ff" stroke="#4d83d8" stroke-width="2.5"/><text x="380" y="143" font-size="24" font-weight="700" fill="#163b78" text-anchor="middle">Microsoft Entra ID</text><text x="380" y="173" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">James authenticates (OIDC / PKCE)</text><path d="M380 195V231" fill="none" stroke="#64748b" stroke-width="3"/><path d="M371 219L380 233L389 219" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="235" width="606" height="120" rx="27" fill="#fff2d9" stroke="#d78a20" stroke-width="2.5"/><text x="380" y="269" font-size="22" font-weight="700" fill="#91500d" text-anchor="middle">Initial sign-in — both tokens issued together</text><rect x="98" y="285" width="270" height="42" rx="16" fill="#fff" stroke="#64748b" stroke-width="2.5"/><path d="M116 293l10 5v16l-10 5l-10 -5v-16z" fill="#64748b"/><circle cx="116" cy="306" r="3" fill="#fff"/><text x="135" y="312" font-size="16" font-weight="700" fill="#243247" text-anchor="start">ID token · Login</text><rect x="392" y="285" width="270" height="42" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2.5"/><path d="M410 293l10 5v16l-10 5l-10 -5v-16z" fill="#0f766e"/><circle cx="410" cy="306" r="3" fill="#fff"/><text x="429" y="312" font-size="16" font-weight="700" fill="#243247" text-anchor="start">Runtime access token</text><text x="233" y="344" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Establishes application session</text><text x="527" y="344" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Audience: AgentCore Runtime</text><path d="M380 355V391" fill="none" stroke="#64748b" stroke-width="3"/><path d="M371 379L380 393L389 379" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="395" width="560" height="90" rx="18" fill="#e8f2ff" stroke="#4d83d8" stroke-width="2.5"/><text x="380" y="433" font-size="24" font-weight="700" fill="#163b78" text-anchor="middle">Enterprise AI Application</text><text x="380" y="463" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">James is signed in and asks his question</text><path d="M380 485V521" fill="none" stroke="#64748b" stroke-width="3"/><path d="M371 509L380 523L389 509" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="452" y="488" width="242" height="42" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2.5"/><path d="M470 496l10 5v16l-10 5l-10 -5v-16z" fill="#0f766e"/><circle cx="470" cy="509" r="3" fill="#fff"/><text x="489" y="515" font-size="16" font-weight="700" fill="#243247" text-anchor="start">Runtime access token</text><rect x="100" y="525" width="560" height="90" rx="18" fill="#e4f6f1" stroke="#1a9a7c" stroke-width="2.5"/><text x="380" y="563" font-size="24" font-weight="700" fill="#125748" text-anchor="middle">AgentCore Runtime</text><text x="380" y="593" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">AI agent selects the diagnostics tool</text><path d="M380 615V651" fill="none" stroke="#64748b" stroke-width="3"/><path d="M371 639L380 653L389 639" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="380" cy="725" rx="330" ry="70" fill="#fff2d9" stroke="#d78a20" stroke-width="3"/><text x="380" y="689" font-size="23" font-weight="700" fill="#92500b" text-anchor="middle">OBO #1 — token exchange (James)</text><rect x="104" y="712" width="249" height="42" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2.5"/><path d="M122 720l10 5v16l-10 5l-10 -5v-16z" fill="#0f766e"/><circle cx="122" cy="733" r="3" fill="#fff"/><text x="141" y="739" font-size="16" font-weight="700" fill="#243247" text-anchor="start">Runtime access token</text><text x="380" y="741" font-size="26" font-weight="700" fill="#92500b" text-anchor="middle">→</text><rect x="407" y="712" width="249" height="42" rx="16" fill="#fff" stroke="#6d57bd" stroke-width="2.5"/><path d="M425 720l10 5v16l-10 5l-10 -5v-16z" fill="#6d57bd"/><circle cx="425" cy="733" r="3" fill="#fff"/><text x="444" y="739" font-size="16" font-weight="700" fill="#243247" text-anchor="start">G1 access token</text><path d="M380 795V831" fill="none" stroke="#64748b" stroke-width="3"/><path d="M371 819L380 833L389 819" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="835" width="560" height="90" rx="18" fill="#e9edff" stroke="#7074cf" stroke-width="2.5"/><text x="380" y="873" font-size="24" font-weight="700" fill="#3c408d" text-anchor="middle">AgentCore Gateway (G1)</text><text x="380" y="903" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Validates G1 token; Cedar authorizes tool</text><path d="M380 925V961" fill="none" stroke="#64748b" stroke-width="3"/><path d="M371 949L380 963L389 949" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="380" cy="1035" rx="330" ry="70" fill="#fff2d9" stroke="#d78a20" stroke-width="3"/><text x="380" y="999" font-size="23" font-weight="700" fill="#92500b" text-anchor="middle">OBO #2 — token exchange (James)</text><rect x="104" y="1022" width="249" height="42" rx="16" fill="#fff" stroke="#6d57bd" stroke-width="2.5"/><path d="M122 1030l10 5v16l-10 5l-10 -5v-16z" fill="#6d57bd"/><circle cx="122" cy="1043" r="3" fill="#fff"/><text x="141" y="1049" font-size="16" font-weight="700" fill="#243247" text-anchor="start">G1 access token</text><text x="380" y="1051" font-size="26" font-weight="700" fill="#92500b" text-anchor="middle">→</text><rect x="407" y="1022" width="249" height="42" rx="16" fill="#fff" stroke="#0284c7" stroke-width="2.5"/><path d="M425 1030l10 5v16l-10 5l-10 -5v-16z" fill="#0284c7"/><circle cx="425" cy="1043" r="3" fill="#fff"/><text x="444" y="1049" font-size="16" font-weight="700" fill="#243247" text-anchor="start">Network API access token</text><path d="M380 1105V1141" fill="none" stroke="#64748b" stroke-width="3"/><path d="M371 1129L380 1143L389 1129" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="1145" width="560" height="90" rx="18" fill="#e6f5ff" stroke="#2785ba" stroke-width="2.5"/><text x="380" y="1183" font-size="24" font-weight="700" fill="#14577d" text-anchor="middle">Network Operations API</text><text x="380" y="1213" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Validates token; enforces James's VIC-only access</text><path d="M380 1235V1271" fill="none" stroke="#64748b" stroke-width="3"/><path d="M371 1259L380 1273L389 1259" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="1275" width="560" height="70" rx="16" fill="#dcfce7" stroke="#2d9b56" stroke-width="2.5"/><text x="380" y="1319" font-size="21" font-weight="700" fill="#166534" text-anchor="middle">Permitted result → AI agent → James</text><text x="380" y="1390" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Each access token has a different audience.</text><text x="380" y="1419" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">OBO preserves James's identity; it does not grant extra permissions.</text></g></svg>